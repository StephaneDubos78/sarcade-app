name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log
      - name: Test
        # Run even when analyze fails, to report both in one CI round.
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log
      - name: Report analyze and test errors
        if: failure()
        shell: bash
        run: |
          # Raw logs are not always reachable: surface the diagnosis as annotations.
          for f in analyze.log test.log; do
            [ -f "$f" ] || continue
            grep -E "error •|warning •|info •|Expected:|Actual:|Error:|FAILED|\[E\]|^lib/|^test/" "$f" | head -60 \
              | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error title=$f::${line}"; done || true
          done

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Windows runner
        shell: pwsh
        run: |
          if (-not (Test-Path ".\windows")) { flutter create --platforms=windows --no-pub . }
          if (Test-Path ".\test\widget_test.dart") { Remove-Item ".\test\widget_test.dart" -Force }
          python tool/patch_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Windows
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release 2>&1 | tee windows-build.log
      - name: Report Windows build errors
        if: failure()
        shell: bash
        run: |
          grep -n -B2 -A6 -E "error|Error|FAILED|fatal" windows-build.log \
            | head -80 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line}"; done || true

  android-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android runner
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --org org.sarcade --no-pub .; fi
          rm -f test/widget_test.dart
          python3 tool/patch_android.py
      - run: flutter pub get
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee android-build.log
      - name: Report Android build errors
        if: failure()
        shell: bash
        run: |
          # Surface the Gradle diagnosis as annotations, readable without the raw log.
          grep -n -A12 -E "What went wrong|error:|Error:|FAILURE|requires|minSdk|compileSdk|incompatible" android-build.log \
            | head -80 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line}"; done || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sarcade-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to the android-dev pre-release
        # Stable download link for phones: the GitHub mobile app cannot fetch Actions artifacts.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk sarcade-dev.apk
          if ! gh release view android-dev >/dev/null 2>&1; then
            gh release create android-dev --prerelease --target "$GITHUB_SHA" \
              --title "SARCADE Android (développement)" \
              --notes "APK de développement V0.1, mis à jour automatiquement par la CI. Signé avec la clé de debug, réservé aux tests."
          fi
          gh release upload android-dev sarcade-dev.apk --clobber

  ios-build:
    # Unsigned build: proves the app compiles for iPhone. Signing and the
    # TestFlight upload are added once the Apple Developer account exists.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate iOS runner
        run: |
          if [ ! -d ios ]; then flutter create --platforms=ios --org org.sarcade --no-pub .; fi
          rm -f test/widget_test.dart
          python3 tool/patch_ios.py
      - run: flutter pub get
      - name: Build iOS (no code signing)
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee ios-build.log
      - name: Report iOS build errors
        if: failure()
        shell: bash
        run: |
          grep -n -A8 -E "error:|Error:|FAILED|requires|deployment target" ios-build.log \
            | head -80 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line}"; done || true

  linux-build:
    # Linux desktop client: Linux PCs and Chromebooks (Linux development
    # environment). On ChromeOS the Android app remains the main channel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Generate Linux runner
        run: |
          if [ ! -d linux ]; then flutter create --platforms=linux --org org.sarcade --no-pub .; fi
          rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Build Linux
        shell: bash
        run: |
          set -o pipefail
          flutter build linux --release 2>&1 | tee linux-build.log
      - name: Report Linux build errors
        if: failure()
        shell: bash
        run: |
          grep -n -A8 -E "error:|Error:|FAILED|undefined reference|not found" linux-build.log \
            | head -80 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line}"; done || true
      - name: Package
        run: tar -czf sarcade-linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: sarcade-linux-x64
          path: sarcade-linux-x64.tar.gz
          retention-days: 30

  web-build:
    # Web client, opened in any browser and installable (PWA) on ChromeOS.
    # Served by the SARCADE server itself, so it also works on a LAN without
    # Internet: --no-web-resources-cdn bundles the rendering engine instead of
    # downloading it from a Google CDN at startup.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate web runner
        run: |
          if [ ! -d web ]; then flutter create --platforms=web --org org.sarcade --no-pub .; fi
          rm -f test/widget_test.dart
          python3 tool/patch_web.py
      - run: flutter pub get
      - name: Build web
        shell: bash
        run: |
          set -o pipefail
          flutter build web --release --no-web-resources-cdn 2>&1 | tee web-build.log
      - name: Report web build errors
        if: failure()
        shell: bash
        run: |
          grep -n -A8 -E "Error:|error:|FAILED|not available on this platform|Target dart2js failed" web-build.log \
            | head -80 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line}"; done || true
      - name: Package
        run: tar -czf sarcade-web.tar.gz -C build/web .
      - uses: actions/upload-artifact@v4
        with:
          name: sarcade-web
          path: sarcade-web.tar.gz
          retention-days: 30
      - name: Publish to the web-dev pre-release
        # Stable link used by the sarcade-server Docker image to embed the web client.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view web-dev >/dev/null 2>&1; then
            gh release create web-dev --prerelease --target "$GITHUB_SHA" \
              --title "SARCADE Web (développement)" \
              --notes "Client Web V0.1, mis à jour automatiquement par la CI. Intégré à l'image Docker de sarcade-server."
          fi
          gh release upload web-dev sarcade-web.tar.gz --clobber
