name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Windows runner
        shell: pwsh
        run: |
          if (-not (Test-Path ".\windows")) { flutter create --platforms=windows --no-pub . }
          if (Test-Path ".\test\widget_test.dart") { Remove-Item ".\test\widget_test.dart" -Force }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android runner
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --org org.sarcade --no-pub .; fi
          rm -f test/widget_test.dart
          python3 tool/patch_android.py
      - run: flutter pub get
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee android-build.log
      - name: Report Android build errors
        if: failure()
        shell: bash
        run: |
          # Surface the Gradle diagnosis as annotations, readable without the raw log.
          grep -n -A12 -E "What went wrong|error:|Error:|FAILURE|requires|minSdk|compileSdk|incompatible" android-build.log \
            | head -80 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line}"; done || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sarcade-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
