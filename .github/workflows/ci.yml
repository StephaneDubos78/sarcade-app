name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Shown in the settings to tell test builds apart (branch@commit).
  SARCADE_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log
      - name: Test
        # Run even when analyze fails, to report both in one CI round.
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log
      - name: Report analyze and test errors
        if: failure()
        shell: bash
        run: |
          # Raw logs are not always reachable: surface the diagnosis as annotations.
          for f in analyze.log test.log; do
            [ -f "$f" ] || continue
            grep -E "error •|warning •|info •|Expected:|Actual:|Error:|FAILED|\[E\]|^lib/|^test/" "$f" | head -60 \
              | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error title=$f::${line}"; done || true
          done

  windows-build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Windows runner
        shell: pwsh
        run: |
          if (-not (Test-Path ".\windows")) { flutter create --platforms=windows --no-pub . }
          if (Test-Path ".\test\widget_test.dart") { Remove-Item ".\test\widget_test.dart" -Force }
          python tool/patch_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Windows
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release --dart-define=SARCADE_BUILD_NUMBER=${{ github.run_number }} --dart-define=SARCADE_BUILD="${SARCADE_BRANCH}@${GITHUB_SHA:0:7}" 2>&1 | tee windows-build.log
      - name: Start test of the Windows client (smoke)
        # Card « Client Windows : écran gris au démarrage » (31 Oct 2026): the
        # built app is started with SARCADE_SMOKE_FILE; it writes a report
        # once its first screen is up (errors included) and quits. A capture
        # of the screen and the startup log are kept as an artifact.
        shell: pwsh
        run: |
          $exe = "build\windows\x64\runner\Release\sarcade_app.exe"
          $out = "smoke"; New-Item -ItemType Directory -Force $out | Out-Null
          & tool\windows_smoke.ps1 -Exe $exe -Out $out
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke
          path: smoke
          retention-days: 30
      - name: Report Windows build errors
        if: failure()
        shell: bash
        run: |
          grep -n -B2 -A6 -E "error|Error|FAILED|fatal" windows-build.log \
            | head -80 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line}"; done || true
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $env:SARCADE_VERSION = $v
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc tool\windows_installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\installer\sarcade-windows-portable.zip
      - name: Sign the installer (when the certificate is in the secrets)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX) { Write-Host "No certificate: installer left unsigned"; exit 0 }
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like "*x64*" } | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 build\installer\sarcade-windows-setup.exe
          $code = $LASTEXITCODE
          Remove-Item cert.pfx
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: sarcade-windows
          path: |
            build/installer/sarcade-windows-setup.exe
            build/installer/sarcade-windows-portable.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish to the windows-dev pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # only what is merged: the NAS and testers fetch this link
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view windows-dev >/dev/null 2>&1; then
            gh release create windows-dev --prerelease --target "$GITHUB_SHA" \
              --title "SARCADE Windows (développement)" \
              --notes "Installeur Windows de développement V0.1, mis à jour automatiquement par la CI. Non signé tant que le certificat n'est pas dans les secrets."
          fi
          gh release upload windows-dev build/installer/sarcade-windows-setup.exe build/installer/sarcade-windows-portable.zip --clobber

  android-build:
    runs-on: ubuntu-latest
    # Two merges close together: the Google Play upload of the second one
    # used to fail (« This edit has expired », 28 Oct 2026). One at a time.
    concurrency:
      group: android-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fixed signing key (secrets placed by the project owner)
        # Same key for every test APK: they install over the previous one.
        # Absent (fork, secrets not yet created): debug signing, as before.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sarcade.jks"
            echo "SARCADE_KEYSTORE=$RUNNER_TEMP/sarcade.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 absent: APK signed with a random debug key (uninstall needed to update)"
          fi
      - name: Generate Android runner
        env:
          SARCADE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SARCADE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --org org.sarcade --no-pub .; fi
          rm -f test/widget_test.dart
          python3 tool/patch_android.py
      - run: flutter pub get
      - name: Firebase project for the wake-up (secret GOOGLE_SERVICES_JSON)
        # Note « Réveil des appareils »: the identifiers of the Firebase
        # project become --dart-define values; absent: no wake-up, as before.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::warning::GOOGLE_SERVICES_JSON absent: Android not woken"; exit 0; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" | python3 -c '
          import json, sys
          g = json.load(sys.stdin)
          client = next(c for c in g["client"] if c["client_info"]["android_client_info"]["package_name"] == "org.sarcade.sarcade_app")
          key = client["api_key"][0]["current_key"]
          print("::add-mask::" + key)
          defines = " ".join([
              "--dart-define=SARCADE_FCM_API_KEY=" + key,
              "--dart-define=SARCADE_FCM_APP_ID=" + client["client_info"]["mobilesdk_app_id"],
              "--dart-define=SARCADE_FCM_SENDER_ID=" + g["project_info"]["project_number"],
              "--dart-define=SARCADE_FCM_PROJECT_ID=" + g["project_info"]["project_id"]])
          open(__import__("os").environ["GITHUB_ENV"], "a").write("SARCADE_FCM_DEFINES=" + defines + "\n")
          '
          echo "::notice::Firebase wake-up built in"
      - name: Build APK
        shell: bash
        env:
          SARCADE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SARCADE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -o pipefail
          # versionCode = CI run number: always increasing, as Google Play requires.
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=SARCADE_BUILD_NUMBER=${{ github.run_number }} --dart-define=SARCADE_BUILD="${SARCADE_BRANCH}@${GITHUB_SHA::7}" ${SARCADE_FCM_DEFINES:-} 2>&1 | tee android-build.log
      - name: Build Play Store bundle (AAB)
        # Google Play only accepts an AAB signed with the upload key (the
        # SARCADE key; Google re-signs with its own key: Play App Signing).
        # Built on every run (proves it builds), published with the APK.
        shell: bash
        env:
          SARCADE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SARCADE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -o pipefail
          if [ -z "${SARCADE_KEYSTORE:-}" ]; then echo "::warning::signing key absent: no AAB (Google Play refuses a debug key)"; exit 0; fi
          flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=SARCADE_BUILD_NUMBER=${{ github.run_number }} --dart-define=SARCADE_BUILD="${SARCADE_BRANCH}@${GITHUB_SHA::7}" ${SARCADE_FCM_DEFINES:-} 2>&1 | tee -a android-build.log
          echo "::notice::AAB versionCode ${{ github.run_number }}"
      - name: Report Android build errors
        if: failure()
        shell: bash
        run: |
          # Surface the Gradle diagnosis as annotations, readable without the raw log.
          grep -n -A12 -E "What went wrong|error:|Error:|FAILURE|requires|minSdk|compileSdk|incompatible" android-build.log \
            | head -80 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line}"; done || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sarcade-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to the android-dev pre-release
        # Stable download link for phones: the GitHub mobile app cannot fetch Actions artifacts.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # One pre-release per branch (android-<branch>), plus android-dev
          # for main: the APK of a PR under test is never replaced by
          # another PR built at the same time.
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [ "$branch" = main ]; then tag=android-dev; else tag="android-$(echo "$branch" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')"; fi
          cp build/app/outputs/flutter-apk/app-release.apk sarcade-dev.apk
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --target "$GITHUB_SHA" \
              --title "SARCADE Android ($branch)" \
              --notes "APK de test de la branche $branch, mis à jour automatiquement par la CI. Signé avec la clé SARCADE (installation par-dessus la version précédente)."
          fi
          gh release upload "$tag" sarcade-dev.apk --clobber
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab sarcade-play.aab
            gh release upload "$tag" sarcade-play.aab --clobber
            echo "::notice::AAB : https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/sarcade-play.aab"
          fi
          echo "::notice::APK : https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/sarcade-dev.apk"

      - name: Upload to Google Play (internal testing track)
        # Every push to main goes to the « Test interne » track. Needs the
        # PLAY_SERVICE_ACCOUNT_JSON secret (service account invited in the
        # Play Console with release rights); absent: skipped with a warning.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          if [ -z "$PLAY_JSON" ] || [ ! -f build/app/outputs/bundle/release/app-release.aab ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON or AAB absent: no Google Play upload"; exit 0
          fi
          echo "$PLAY_JSON" > "$RUNNER_TEMP/play.json"
          echo "PLAY_UPLOAD=1" >> "$GITHUB_ENV"
      - name: Send the AAB to Google Play
        if: env.PLAY_UPLOAD == '1'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ runner.temp }}/play.json
          packageName: org.sarcade.sarcade_app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          # « draft » while the app is a draft in the Play Console (Google
          # refuses anything else); set the repository variable
          # PLAY_RELEASE_STATUS=completed once the app is published.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          releaseName: ${{ github.run_number }} main
          # max 50 characters for Google Play

  ios-build:
    # iPhone (note « Publication App Store (TestFlight) »). Pull requests:
    # unsigned build, proves the app compiles. main: archive signed by Apple
    # (cloud signing with the App Store Connect API key) and sent to
    # TestFlight (also on a manual run of a branch, to test before merging);
    # build number = CI run number. Secrets absent: unsigned only.
    runs-on: macos-latest
    concurrency:
      group: ios-${{ github.ref }}
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate iOS runner
        run: |
          if [ ! -d ios ]; then flutter create --platforms=ios --org org.sarcade --no-pub .; fi
          rm -f test/widget_test.dart
          python3 tool/patch_ios.py
      - run: flutter pub get
      - name: Firebase project for the iPhone wake-up (secret GOOGLE_SERVICE_INFO_PLIST)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        shell: bash
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then echo "::warning::GOOGLE_SERVICE_INFO_PLIST absent: iPhone not woken"; exit 0; fi
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | python3 -c '
          import os, plistlib, sys
          g = plistlib.loads(sys.stdin.buffer.read())
          print("::add-mask::" + g["API_KEY"])
          defines = " ".join([
              "--dart-define=SARCADE_FCM_IOS_API_KEY=" + g["API_KEY"],
              "--dart-define=SARCADE_FCM_IOS_APP_ID=" + g["GOOGLE_APP_ID"],
              "--dart-define=SARCADE_FCM_SENDER_ID=" + g["GCM_SENDER_ID"],
              "--dart-define=SARCADE_FCM_PROJECT_ID=" + g["PROJECT_ID"]])
          open(os.environ["GITHUB_ENV"], "a").write("SARCADE_FCM_DEFINES=" + defines + "\n")
          '
          echo "::notice::Firebase wake-up built in (iPhone)"
      - name: Build iOS (no code signing)
        if: github.event_name == 'pull_request' || env.ASC_API_KEY == ''
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }} --dart-define=SARCADE_BUILD_NUMBER=${{ github.run_number }} --dart-define=SARCADE_BUILD="${SARCADE_BRANCH}@${GITHUB_SHA::7}" ${SARCADE_FCM_DEFINES:-} 2>&1 | tee ios-build.log
      - name: Archive, sign and send to TestFlight
        if: github.event_name != 'pull_request' && env.ASC_API_KEY != ''
        shell: bash
        run: |
          set -o pipefail
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_API_KEY" > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          flutter build ios --release --config-only --build-number=${{ github.run_number }} --dart-define=SARCADE_BUILD_NUMBER=${{ github.run_number }} --dart-define=SARCADE_BUILD="${SARCADE_BRANCH}@${GITHUB_SHA::7}" ${SARCADE_FCM_DEFINES:-} 2>&1 | tee ios-build.log
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive 2>&1 | tee -a ios-build.log | grep -E "error|warning: .*sign|ARCHIVE" || true
          test -d "$RUNNER_TEMP/Runner.xcarchive" || { echo "::error::archive failed"; exit 1; }
          # Entitlements (push) put on the archived app with an ad hoc
          # signature; the export keeps them when it signs for the App Store.
          app="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app"
          for f in "$app"/Frameworks/*; do codesign --force --sign - "$f"; done
          codesign --force --sign - --entitlements ios/Runner/Runner.entitlements "$app"
          # Archive left unsigned (no development profile: the team has no
          # registered device); the export signs it for the App Store with the
          # distribution certificate managed by Apple (cloud signing).
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>34785R7XLK</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            "${auth[@]}" 2>&1 | tee -a ios-build.log
          # Upload with altool: Xcode's own upload does not use the API key
          # (« No Accounts with App Store Connect Access »).
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa)
          # The push entitlement must survive the export (wake-up).
          (cd "$RUNNER_TEMP" && rm -rf ipa-check && mkdir ipa-check && cd ipa-check && unzip -q "$ipa" \
            && codesign -d --entitlements :- Payload/Runner.app 2>/dev/null | grep -A1 aps-environment \
            && echo "::notice::aps-environment present") || echo "::warning::aps-environment missing in the signed app"
          mkdir -p ~/.appstoreconnect/private_keys && cp "$key" ~/.appstoreconnect/private_keys/
          xcrun altool --upload-app -f "$ipa" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee -a ios-build.log
          rm -f "$key" ~/.appstoreconnect/private_keys/*.p8
          echo "::notice::iPhone build ${{ github.run_number }} sent to TestFlight"
      - name: Report iOS build errors
        if: failure()
        shell: bash
        run: |
          grep -n -A8 -E "error:|Error:|FAILED|requires|deployment target|No profiles|Cloud signing|permission" ios-build.log \
            | head -80 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line}"; done || true

  linux-build:
    # Linux desktop client: Linux PCs and Chromebooks (Linux development
    # environment). On ChromeOS the Android app remains the main channel.
    runs-on: ubuntu-24.04  # pinned: Ubuntu 26 clang rejects json.hpp of flutter_secure_storage_linux (-Werror)
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      - name: Generate Linux runner
        run: |
          if [ ! -d linux ]; then flutter create --platforms=linux --org org.sarcade --no-pub .; fi
          rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Build Linux
        shell: bash
        run: |
          set -o pipefail
          flutter build linux --release --dart-define=SARCADE_BUILD_NUMBER=${{ github.run_number }} --dart-define=SARCADE_BUILD="${SARCADE_BRANCH}@${GITHUB_SHA::7}" 2>&1 | tee linux-build.log
      - name: Report Linux build errors
        if: failure()
        shell: bash
        run: |
          grep -n -A8 -E "error:|Error:|FAILED|undefined reference|not found" linux-build.log \
            | head -80 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line}"; done || true
      - name: Package
        run: |
          tar -czf sarcade-linux-x64.tar.gz -C build/linux/x64/release bundle
          sh tool/make_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sarcade-linux-x64
          path: |
            sarcade-linux-x64.tar.gz
            sarcade-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

  web-build:
    # Web client, opened in any browser and installable (PWA) on ChromeOS.
    # Served by the SARCADE server itself, so it also works on a LAN without
    # Internet: --no-web-resources-cdn bundles the rendering engine instead of
    # downloading it from a Google CDN at startup.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate web runner
        run: |
          if [ ! -d web ]; then flutter create --platforms=web --org org.sarcade --no-pub .; fi
          rm -f test/widget_test.dart
          python3 tool/patch_web.py
      - run: flutter pub get
      - name: Build web
        shell: bash
        run: |
          set -o pipefail
          flutter build web --release --no-web-resources-cdn --dart-define=SARCADE_BUILD_NUMBER=${{ github.run_number }} --dart-define=SARCADE_BUILD="${SARCADE_BRANCH}@${GITHUB_SHA::7}" 2>&1 | tee web-build.log
          # Build served next to the app: open clients compare it with theirs
          # and offer « Mettre à jour » (lib/src/models/web_update.dart).
          printf '{"build":"%s"}\n' "${SARCADE_BRANCH}@${GITHUB_SHA::7}" > build/web/sarcade_build.json
          # Code file named after the build: no copy of an older one can run.
          python3 tool/version_web.py build/web "${SARCADE_BRANCH}@${GITHUB_SHA::7}"
      - name: Report web build errors
        if: failure()
        shell: bash
        run: |
          grep -n -A8 -E "Error:|error:|FAILED|not available on this platform|Target dart2js failed" web-build.log \
            | head -80 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line}"; done || true
      - name: Package
        run: tar -czf sarcade-web.tar.gz -C build/web .
      - uses: actions/upload-artifact@v4
        with:
          name: sarcade-web
          path: sarcade-web.tar.gz
          retention-days: 30
      - name: Publish to the web-dev pre-release
        # Stable link used by the sarcade-server Docker image to embed the web client.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # only what is merged: the NAS and testers fetch this link
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view web-dev >/dev/null 2>&1; then
            gh release create web-dev --prerelease --target "$GITHUB_SHA" \
              --title "SARCADE Web (développement)" \
              --notes "Client Web V0.1, mis à jour automatiquement par la CI. Intégré à l'image Docker de sarcade-server."
          fi
          gh release upload web-dev sarcade-web.tar.gz --clobber

  e2e:
    # End-to-end tests (vault note « Tests automatiques de bout en bout »):
    # real SARCADE server (demo stack of sarcade-server), web client of this
    # branch driven by Playwright as the PCO, field terminal simulated
    # through the API. Server branch: main, or « server-branch: feat/... »
    # in the pull request description.
    needs: web-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Server branch
        id: server
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          branch=$(printf '%s' "$PR_BODY" | sed -n 's/^[[:space:]]*server-branch:[[:space:]]*\([^[:space:]]*\).*/\1/p' | head -1)
          echo "branch=${branch:-main}" >> "$GITHUB_OUTPUT"
          echo "Server branch: ${branch:-main}"
      - uses: actions/checkout@v4
        with:
          repository: sdubos-consulting/sarcade-server
          ref: ${{ steps.server.outputs.branch }}
          path: sarcade-server
      - uses: actions/download-artifact@v4
        with:
          name: sarcade-web
      - name: Web client of this branch
        run: mkdir -p e2e/web && tar -xzf sarcade-web.tar.gz -C e2e/web && test -f e2e/web/index.html
      - name: Start the SARCADE server
        env:
          SARCADE_E2E_WEB: ${{ github.workspace }}/e2e/web
        run: |
          docker compose -f sarcade-server/demo/docker-compose.demo.yml -f e2e/compose.e2e.yml up -d --build postgres services-stub server
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/health && break; sleep 2; done
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ | grep -q SARCADE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: e2e
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run the scenarios
        working-directory: e2e
        env:
          SARCADE_URL: http://localhost:8000
        run: npx playwright test
      - name: Server logs on failure
        if: failure()
        env:
          SARCADE_E2E_WEB: ${{ github.workspace }}/e2e/web
        run: docker compose -f sarcade-server/demo/docker-compose.demo.yml -f e2e/compose.e2e.yml logs --tail 200 server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            e2e/report
            e2e/test-results
          retention-days: 30

  e2e-android:
    # Step 2 of the end-to-end tests: the real Android app in an emulator is
    # the field terminal ADR78-01 (integration_test), against a real server
    # on this machine (10.0.2.2 from the emulator); the PCO is simulated
    # through the API by the test.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Server branch
        id: server
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          branch=$(printf '%s' "$PR_BODY" | sed -n 's/^[[:space:]]*server-branch:[[:space:]]*\([^[:space:]]*\).*/\1/p' | head -1)
          echo "branch=${branch:-main}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: sdubos-consulting/sarcade-server
          ref: ${{ steps.server.outputs.branch }}
          path: sarcade-server
      - name: Start the SARCADE server and create the test event
        id: event
        run: |
          docker compose -f sarcade-server/demo/docker-compose.demo.yml up -d --build postgres services-stub server
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/health && break; sleep 2; done
          name="E2E android ${GITHUB_RUN_ID}"
          curl -fsS -X POST http://localhost:8000/api/v0.1/events -H 'Content-Type: application/json' \
            -d "{\"name\":\"$name\",\"kind\":\"exercise\"}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android runner
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --org org.sarcade --no-pub .; fi
          rm -f test/widget_test.dart
          python3 tool/patch_android.py
          flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the field terminal in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SARCADE_E2E_EVENT_NAME: ${{ steps.event.outputs.name }}
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash e2e/android/run.sh
      - name: Server logs on failure
        if: failure()
        run: docker compose -f sarcade-server/demo/docker-compose.demo.yml logs --tail 200 server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-android
          path: e2e/android/out
          retention-days: 30
