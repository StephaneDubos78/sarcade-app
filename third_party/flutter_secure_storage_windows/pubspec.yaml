name: flutter_secure_storage_windows
description: >-
  Copy of flutter_secure_storage_windows 3.1.2 (BSD-3-Clause) without its
  native part: the session is stored by the plugin's own DPAPI file storage,
  readable only by the Windows user. The native part needed ATL, which some
  Visual Studio installations lack (recette of 24 October 2026).
version: 3.1.2+sarcade.1
publish_to: none

environment:
  sdk: '>=2.12.0 <4.0.0'
  flutter: ">=2.0.0"

dependencies:
  ffi: ^2.0.0
  flutter:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^1.1.0
  path: ^1.8.0
  path_provider: ^2.0.0
  win32: ^5.0.0

flutter:
  plugin:
    implements: flutter_secure_storage
    platforms:
      windows:
        dartPluginClass: FlutterSecureStorageWindows
